[project]
name = "autodev"
version = "0.1.0"
description = "Turns tracker tickets into verified pull requests using Claude agents"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
    "claude-agent-sdk>=0.2.174",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
autodev = "autodev.__main__:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1", "respx>=0.23.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
