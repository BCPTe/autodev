[project]
name = "autodev"
version = "0.1.0"
description = "Turns tracker tickets into verified pull requests using Claude agents"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.2.170",
    "fastapi>=0.158.2",
    "uvicorn>=0.30",
]

[project.scripts]
autodev = "autodev.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
